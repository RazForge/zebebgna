[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zebebgna"
version = "0.1.0"
description = "Defensive cybersecurity toolkit for verifying Ethiopian bank receipt authenticity and auditing receipt endpoint security"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "pdfplumber",
    "beautifulsoup4",
    "selenium",
]
authors = [{ name = "zebebgna Contributors" }]

[tool.setuptools.packages.find]
include = ["zebebgna*"]

[tool.setuptools.package-data]
zebebgna = ["templates/*.html"]

[project.urls]
Homepage = "https://github.com/RazForge/zebebgna"

[project.optional-dependencies]
dev = ["pytest", "flake8"]
web = ["flask"]
bot = ["python-telegram-bot>=22.0"]

[project.scripts]
zebebgna = "zebebgna.cli:main"
